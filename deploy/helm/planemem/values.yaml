image:
  repository: ghcr.io/planemem/platform
  tag: 0.1.0
  digest: sha256:SET_BY_CI
# The test and production topology has one API replica on each k3s node.
# Override this explicitly for a smaller development cluster.
replicaCount: 3
featureFlags:
  proposalEnabled: false
  vectorEnabled: false
external:
  planeUrl: https://plane.example.invalid
  aiMemoryUrl: http://ai-memory:8787
secrets:
  existingSecret: planemem-secrets
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
