apiVersion: apps/v1
kind: Deployment
metadata:
  name: planemem
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: planemem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planemem
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: platform
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}'
          imagePullPolicy: IfNotPresent
          env:
            - name: PROPOSAL_ENABLED
              value: '{{ .Values.featureFlags.proposalEnabled }}'
            - name: VECTOR_ENABLED
              value: '{{ .Values.featureFlags.vectorEnabled }}'
            - name: AI_MEMORY_URL
              value: '{{ .Values.external.aiMemoryUrl }}'
            - name: MEMORY_PROVIDER_MODE
              value: '{{ .Values.external.memoryProviderMode }}'
            - name: MEMORY_ENABLED
              value: '{{ .Values.external.memoryEnabled }}'
            - name: MEMORY_REQUIRED
              value: '{{ .Values.external.memoryRequired }}'
            - name: MEMORY_ACTOR_ID
              value: '{{ .Values.external.memoryActorId }}'
            - name: MEMORY_CLIENT_ID
              value: '{{ .Values.external.memoryClientId }}'
          envFrom:
            - secretRef:
                name: '{{ .Values.secrets.existingSecret }}'
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
