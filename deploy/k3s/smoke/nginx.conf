server {
  listen 3000;
  server_name _;
  default_type application/json;

  location = /health {
    return 200 '{"status":"ok","service":"planemem-k3s-smoke"}';
  }

  location = /health/ready {
    return 200 '{"status":"ready","service":"planemem-k3s-smoke"}';
  }

  location = /version {
    return 200 '{"version":"0.1.0","mode":"k3s-smoke"}';
  }
}
