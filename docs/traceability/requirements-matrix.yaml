      behavior: "Bounded v1 records retain original binding, selection, observations, full input, credential-free provider configuration and generation. Offline validation checks required/unknown fields, normalized forms, exact cross-record sources/classification/model/version relationships and canonical SHA-256. Explicit record commands preserve completed results on sealing/save failure and compare the original gateway/project/actor/client before opening the queue. Existing draft/key semantics and human review remain unchanged."
      evidence: []
      pending_evidence:
        - "Malformed nested fields, recomputed mismatched records, canonical ordering and size boundaries"
        - "Binding and request-key rejection before database open; original same-key draft replay"
        - "Occupied outputs, incomplete publication and retained preparation/provider/generation recovery"
      remaining_scope: "Records are consistency checks, not source/provider authentication or current permission/freshness proof. Provider-side unknown-call reconciliation, global audit, quality/cost evaluation and runtime evidence remain missing. Local job association and pre-dispatch request journals are added by the separate history/request increments."
      execution: "Source/docs only; no builds, typechecks, tests, CLI/model/Gateway execution, database opens or release. No schema/dependency changes; separate task commit/push to main with skip-ci."
    proposal_generation_source_preparation_development_increment:
      date: "2026-11-04"
      status: "Source-only authenticated selection-to-input workflow; no runtime evidence or R-009 completion."
      artifacts:
        - "workers/intelligence/src/generation-sources.ts"
        - "workers/intelligence/src/generation-output.ts"
        - "workers/intelligence/src/main.ts"
        - "docs/design/01-contracts/proposal-generation-sources-runtime.md"
      behavior: "A fixed token and explicit original gateway/project/actor/client binding preflight identity before reading selected current ContextItem revisions. Scope/trace/version/ETag/source checks and full textual excerpts retain observed status and raise classification as needed. One total deadline, cancellation, per-response and accumulated output bounds prevent partial input publication. The new-file output feeds explicit generation, with identity/observations retained in the result."
      evidence: []
      pending_evidence:
        - "Identity drift, project/classification permissions, hidden/missing/stale sources and version conflicts"
        - "Malformed envelopes, source correspondence, nontext/long content and cumulative limits"
        - "Shared deadline/cancellation across sequential reads and files retained after save failure"
      remaining_scope: "Cross-source snapshots, background discovery/refresh, provider-side reconciliation, global audit and real runtime evidence. Destination-bound artifacts and pre-dispatch local journals are added by the separate record/request increments."
      execution: "Source/docs only; no Gateway/model calls, CLI execution, build, typecheck, tests, database access or release. No Gateway/schema/dependency changes."
    explicit_proposal_generation_development_increment:
      date: "2026-11-04"
      status: "Source-only explicit model generation adapter and draft file workflow; R-009 remains incomplete."
      artifacts:
        - "workers/intelligence/src/generation.ts"
        - "workers/intelligence/src/generation-output.ts"
        - "workers/intelligence/src/main.ts"
        - "docs/design/01-contracts/proposal-generation-runtime.md"
      behavior: "A configured Chat Completions-compatible endpoint receives caller-selected excerpts once. Fixed prompt and strict title/content validation retain original sources, kind, maximum classification and TTL. Credentials stay out of files; one deadline, cancellation, bounded responses and no redirects/retries constrain calls. CLI saves a new verified draft file; save failures retain the generated result. No queue open, automatic submission, approval or authoritative state changes."
      evidence: []
      pending_evidence:
        - "Real provider/model schema compatibility, refusal/truncation and structured response behavior"
        - "Timeout/cancellation including ignored abort, large/invalid responses and no credential/raw-body disclosure"
        - "Input classification limits, fixed references, prompt injection resilience and source fidelity"
        - "Exclusive file publication/readback, occupied targets, interrupted save and retained draft recovery"
      remaining_scope: "Background authorized discovery/refresh, provider-side unknown-call reconciliation, global audit, quality evaluation, provider authentication and runtime evidence. Explicit source preparation and persistent local request journals are added separately."
      execution: "Source/docs only; no model calls, CLI execution, builds, typechecks, tests, database opens or release. Official documentation retrieval did not yield usable full content; compatibility is not verified."
