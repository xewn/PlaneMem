  - id: R-011
    statement: "Every important operation is observable with trace, metrics, logs, health, readiness, and version."
    design: ["observability-plane"]
    subprojects: ["P6", "P8"]
    admin_snapshot_clients_development_increment:
      date: "2026-11-02"
      status: "Source-only SDK, CLI and MCP administration snapshot clients; R-011 remains incomplete."
      artifacts:
        - "packages/contracts/src/workbench-admin.ts"
        - "packages/sdk/src/admin.ts"
        - "packages/sdk/src/client.ts"
        - "packages/sdk/src/index.ts"
        - "apps/workctx-cli/src/admin.ts"
        - "apps/workctx-cli/src/main.ts"
        - "apps/workctx-cli/src/cli.ts"
        - "apps/api-gateway/src/mcp/admin.ts"
        - "apps/api-gateway/src/mcp/catalog.ts"
        - "apps/api-gateway/src/mcp/protocol.ts"
        - "docs/design/01-contracts/workbench-admin-runtime.md"
      boundaries:
        - "Fixed project and trace, complete bounded envelope validation, finite sanitized errors; no inherited write conditions."
        - "Trusted embedded CLI/MCP require verified unexpired administrator and actual admin.read; count availability matches actual audit.read/context.read."
        - "SDK/CLI bounded JSON and local waiting budgets; MCP two preparation slots per gateway, 30 seconds, retained until underlying work settles."
        - "Database read observation only; external checks remain not-checked. No probes, saves, automatic retries or new resources."
        - "No new dependencies or migrations; 016-045 remain unexecuted."
      evidence: []
      remaining:
        - "No compilation, typecheck, tests, CLI/MCP/HTTP execution, services, deployment or publishing."
        - "Mock and fixture compatibility, runtime validation, external health and readiness evidence remain outstanding."
    admin_snapshot_development_increment:
      date: "2026-11-02"
      status: "Source-only scoped administration query observations; no runtime or compatibility evidence."
      artifacts:
        - "packages/contracts/src/workbench-admin.ts"
        - "packages/contracts/src/index.ts"
        - "apps/api-gateway/src/workbench/repository.ts"
        - "apps/api-gateway/src/workbench/query.ts"
        - "apps/api-gateway/src/server.ts"
        - "apps/api-gateway/src/http.ts"
        - "apps/web-console/src/lib/workbench-response.ts"
        - "apps/web-console/src/lib/audit-response.ts"
        - "apps/web-console/src/lib/server-api.ts"
        - "apps/web-console/src/app/admin/page.tsx"
        - "apps/web-console/src/app/admin/model.ts"
        - "docs/design/01-contracts/workbench-admin-runtime.md"
      behavior: "Verified unexpired admin with actual admin.read receives one validated scope/trace/source-bound snapshot. SQL reports current server version, statement time and visible counts gated by actual audit/context capabilities; unavailable counts stay null. Web bounds complete JSON and rejects late/mismatched responses. Static health, feature flags, event-latency and release assertions are replaced with explicit not-checked states."
      remaining_scope: "One query succeeding is not system health or a write/delivery/release attestation. Gateway version is a runtime declaration. Existing admin response and legacy view fixtures require coordinated migration. Dedicated SDK/CLI/MCP source support is tracked above. External probes, configuration views, database cost/concurrency limits and runtime evidence remain incomplete."
      pending_evidence:
        - "Actual admin role/capability/client/expiry checks before and after reads; unknown-input rejection"
        - "Audit/context count capability gates, restricted/deleted project and conflict source visibility, hidden versus zero counts"
        - "SQL numeric text bounds, actual version/time, full envelope keys/scope/trace/sources and unsupported health claims"
        - "16 KiB success/error response limits, UTF-8/media/status/length/trace checks, timeout cancellation and finite error rendering"
        - "AdminPanel original trace binding and ready meaning, explicit refresh/navigation, old response/fixture compatibility"
        - "No new dependency/migration, builds, typechecks, tests, SQL/HTTP/browser/service execution or release; 016–045 unexecuted"
    tests: ["unit.trace_propagation", "integration.health_readiness", "production.smoke_observability"]
    development_increment:
      date: "2026-11-02"
      status: "source-only; not built, tested, enabled or deployed"
      artifacts:
