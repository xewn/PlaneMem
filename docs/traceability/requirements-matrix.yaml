        - "deploy/observability/plane-inbox-alerts.yml"
        - "docs/runbooks/alerts.md"
      feature_flag: "PLANE_INBOX_METRICS_ENABLED=false"
      pending_evidence:
        - "Disabled collection and database-wide metric access boundary"
        - "Snapshot failure/staleness, concurrent scrape and shutdown behavior"
        - "Worker state, multi-gateway gauge semantics and Prometheus rule firing/recovery"
        - "Notification routing; no receiver configured by this increment"
    gates: ["merge", "release_candidate", "production"]

