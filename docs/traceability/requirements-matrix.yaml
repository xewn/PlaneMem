      behavior: "Verified unexpired admin with actual admin.read receives one validated scope/trace/source-bound snapshot. SQL reports current server version, statement time and visible counts gated by actual audit/context capabilities; unavailable counts stay null. Web bounds complete JSON and rejects late/mismatched responses. Static health, feature flags, event-latency and release assertions are replaced with explicit not-checked states."
      remaining_scope: "One query succeeding is not system health or a write/delivery/release attestation. Gateway version is a runtime declaration. Existing admin response and legacy view fixtures require coordinated migration. Dedicated SDK/CLI/MCP source support is tracked above. External probes, configuration views, database cost/concurrency limits and runtime evidence remain incomplete."
