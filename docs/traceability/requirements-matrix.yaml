invariants:
  - "No service directly reads or writes the Plane database."
  - "No cross-service database joins."
  - "Every write carries Idempotency-Key and expected_version or If-Match."
  - "Every event consumer records processed event IDs and aggregate versions."
  - "Schema changes use expand, migrate, contract."
  - "Feature flags remain off in production until the related end-to-end test passes."
  - "Permission-denied requests leave no side effects."

